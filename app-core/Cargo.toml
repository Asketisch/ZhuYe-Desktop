[package]
name = "reflect-app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reflect Desktop 领域服务层：activity / kms / media / squad / side-channel / tailscale / autopilot / traces / discussion / pipeline 等命令逻辑（UI 无关，供 src-tauri 复用）"

[lints]
workspace = true

[lib]
name = "reflect_app_core"
path = "src/lib.rs"

[dependencies]
# Reflect crates（仅保留保留模块实际使用的）
reflect-protocol  = { workspace = true }
reflect-task      = { workspace = true }
# traces:只读查询 telemetry model-io JSONL + rollout 标题映射
reflect-telemetry = { workspace = true }
reflect-rollout   = { workspace = true }
# discussion:多 agent 讨论编排(CLI `reflect discussion` 的 GUI 对应)
reflect-discussion = { workspace = true }
# discussion/pipeline 组装:模型注册表 / 工具注册表 / 子代理工厂 / 配置
reflect-llm        = { workspace = true }
reflect-tools      = { workspace = true }
reflect-subagent   = { workspace = true }
reflect-config     = { workspace = true }
# pipeline:DAG 流水线 + team 四阶段预设(CLI `reflect pipeline` 的 GUI 对应)
reflect-pipeline   = { workspace = true }
async-trait        = { workspace = true }

# 通用
dirs        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["sync", "rt", "macros", "process", "io-util"] }
tokio-util  = { workspace = true, features = ["rt"] }
parking_lot = { workspace = true }
tracing     = { workspace = true }
chrono      = { workspace = true }
anyhow      = { workspace = true }
# pipeline TOML 校验(结构摘要:只读顶层 `nodes` 表,字段语义交核心校验)
toml        = { workspace = true }
# OS 沙箱解析(env>config>基线)已收编上游;桌面侧仅保留协议映射胶水
reflect-sandbox = { workspace = true }
tempfile    = "3"
uuid        = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
