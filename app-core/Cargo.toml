[package]
name = "zhuye-app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "烛夜桌面（ZhuYe Desktop）领域服务层：activity / kms / media / squad / side-channel / tailscale / autopilot / traces / discussion / pipeline 等命令逻辑（UI 无关，供 src-tauri 复用）"

[lints]
workspace = true

[lib]
name = "zhuye_app_core"
path = "src/lib.rs"

[dependencies]
# zhuye-* 核心 crate（仅保留模块实际使用的）
zhuye-protocol  = { workspace = true }
zhuye-task      = { workspace = true }
# traces:只读查询 telemetry model-io JSONL + rollout 标题映射
zhuye-telemetry = { workspace = true }
zhuye-rollout   = { workspace = true }
# discussion:多 agent 讨论编排(CLI `zhuye discussion` 的 GUI 对应)
zhuye-discussion = { workspace = true }
# discussion/pipeline 组装:模型注册表 / 工具注册表 / 子代理工厂 / 配置
zhuye-llm        = { workspace = true }
zhuye-tools      = { workspace = true }
zhuye-subagent   = { workspace = true }
zhuye-config     = { workspace = true }
# pipeline:DAG 流水线 + team 四阶段预设(CLI `zhuye pipeline` 的 GUI 对应)
zhuye-pipeline   = { workspace = true }
# prompt_env:内置上下文注入 hooks(Hook trait / HookDecision / SystemMessage)
zhuye-hooks      = { workspace = true }
# prompt_env:AGENTS.md 段格式生成(append_agents_md_section,与 exec/TUI 同源)
zhuye-prompt     = { workspace = true }
async-trait        = { workspace = true }

# 通用
dirs        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["sync", "rt", "macros", "process", "io-util"] }
tokio-util  = { workspace = true, features = ["rt"] }
parking_lot = { workspace = true }
tracing     = { workspace = true }
chrono      = { workspace = true }
anyhow      = { workspace = true }
# pipeline TOML 校验(结构摘要:只读顶层 `nodes` 表,字段语义交核心校验)
toml        = { workspace = true }
# OS 沙箱解析(env>config>基线)已收编上游;桌面侧仅保留协议映射胶水
zhuye-sandbox = { workspace = true }
tempfile    = "3"
uuid        = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
