# 烛夜 ZhuYe 持续集成。
#
# push / PR 触发:前端(typecheck + vitest)与 Rust(fmt + clippy + test)。
# 注意:本仓库通过 `zhuye-agent/` submodule 引用核心 crate,
# 必须递归 checkout submodule 才能编译。

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只给最小权限:读源码 + 写 cache。Release 由独立 workflow 处理。
permissions:
  contents: read

# 取消同分支前序冗余运行,节省 CI 资源。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  runner-tests:
    name: test runner registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_runner

  # 静态审查层:命令面四方一致 / 路由↔视图 / 版本四处一致 /
  # CHANGELOG 与能力矩阵新鲜度 / 仓库卫生 / 调试残留 / 文件大小预算棘轮。
  # 纯静态分析,秒级 —— 每次 push/PR 都跑,挡住"接线漂移"。
  # 详见 tests/README.md。
  static-audit:
    name: static audit (wiring & repo hygiene)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 静态层只跑 node 内置模块(tests/static/analyze.mjs + `node -p`),
      # 不装 node_modules —— 所以不配 pnpm,也不开 `cache: pnpm`:
      # 没跑过 `pnpm install` 时 store 路径不存在,setup-node 的 post 步骤
      # 会以 "Path Validation Error" 把整个 job 判失败。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run static audit layer
        run: bash tests/run_all.sh static

  frontend:
    name: frontend (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24(与 package.json `engines.node` 对齐):vitest 的 jsdom 30
      # 依赖 undici 8,后者要求 Node ≥ 22.19;Node 20 上 worker 启动即崩
      # (`decompress.js` 读不到 zstd zlib API)。Node 20 已于 2026-04 EOL。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm test
        run: pnpm test

  fmt:
    name: rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # 只检查本仓库自有 crate(app-core + src-tauri):
      # zhuye-agent/ submodule 的格式由上游 ZhuYe 仓库的 CI 负责,
      # 避免上游格式状态阻塞本仓库。
      - name: cargo fmt --check (own crates)
        run: cargo fmt -p reflect-app-core -p reflect-desktop -- --check

  clippy:
    name: rust clippy (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          # windows-2025-vs2026 的 WebView2 Runtime 150+ 在管理员进程上
          # 会忽略 WebDriver 注入的远程调试端口(actions/runner-images#14738)。
          # 先钉 windows-2022 保持真实窗口矩阵;上游修复后再恢复 latest。
          - os: windows
            runner: windows-2022
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Linux:Tauri 编译期依赖(wry / tao 走 glib + webkit2gtk)。
      # 包名与 .github/workflows/release.yml、tauri.conf.json deb.depends 对齐。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libpipewire-0.3-dev \
            libasound2-dev \
            libgbm-dev \
            libdrm-dev \
            libegl-dev \
            libwayland-dev

      # 警告拒绝策略在成员 crate 清单的 [lints] 表中声明(见根 Cargo.toml 注释):
      # 只对本仓库自有 crate deny,zhuye-agent/ submodule 的上游警告不阻塞本仓库。
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  test:
    name: rust test (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          # 与 clippy 相同,Windows E2E 暂钉 windows-2022 避开 WebView2
          # Runtime 150+ 的管理员调试端口硬化回归。
          - os: windows
            runner: windows-2022
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libpipewire-0.3-dev \
            libasound2-dev \
            libgbm-dev \
            libdrm-dev \
            libegl-dev \
            libwayland-dev

      - name: cargo test
        run: cargo test --workspace --all-targets

  e2e-native:
    name: native e2e (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-24.04
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libpipewire-0.3-dev \
            libasound2-dev \
            libgbm-dev \
            libdrm-dev \
            libegl-dev \
            libwayland-dev \
            webkit2gtk-driver \
            xvfb

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Install tauri-driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked

      - name: Install matching Microsoft Edge WebDriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"

      - name: Run native e2e
        env:
          E2E_REQUIRED: '1'
          GATE_STRICT: '1'
        run: bash tests/run_all.sh e2e
