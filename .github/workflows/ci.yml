# 烛夜 ZhuYe 持续集成。
#
# push / PR 触发:前端(typecheck + vitest)与 Rust(fmt + clippy + test)。
# 注意:本仓库通过 `reflect-agent/` submodule 引用核心 crate,
# 必须递归 checkout submodule 才能编译。

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只给最小权限:读源码 + 写 cache。Release 由独立 workflow 处理。
permissions:
  contents: read

# 取消同分支前序冗余运行,节省 CI 资源。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 静态审查层:命令面四方一致 / 路由↔视图 / 版本四处一致 /
  # CHANGELOG 与能力矩阵新鲜度 / 仓库卫生 / 调试残留 / 文件大小预算棘轮。
  # 纯静态分析,秒级 —— 每次 push/PR 都跑,挡住"接线漂移"。
  # 详见 tests/README.md。
  static-audit:
    name: static audit (wiring & repo hygiene)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 静态层只跑 node 内置模块(tests/static/analyze.mjs + `node -p`),
      # 不装 node_modules —— 所以不配 pnpm,也不开 `cache: pnpm`:
      # 没跑过 `pnpm install` 时 store 路径不存在,setup-node 的 post 步骤
      # 会以 "Path Validation Error" 把整个 job 判失败。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run static audit layer
        run: bash tests/run_all.sh static

  frontend:
    name: frontend (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24(与 package.json `engines.node` 对齐):vitest 的 jsdom 30
      # 依赖 undici 8,后者要求 Node ≥ 22.19;Node 20 上 worker 启动即崩
      # (`decompress.js` 读不到 zstd zlib API)。Node 20 已于 2026-04 EOL。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm test
        run: pnpm test

  fmt:
    name: rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # 只检查本仓库自有 crate(app-core + src-tauri):
      # reflect-agent/ submodule 的格式由上游 ZhuYe 仓库的 CI 负责,
      # 避免上游格式状态阻塞本仓库。
      - name: cargo fmt --check (own crates)
        run: cargo fmt -p reflect-app-core -p reflect-desktop -- --check

  clippy:
    name: rust clippy (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          # Windows 只进 clippy(编译级)矩阵,不进 test:
          # 能力覆盖夹具靠 HOME 隔离,而 Windows 的 dirs::home_dir() 走
          # USERPROFILE,跑测试会污染真实用户目录 —— 见 tests/COVERAGE.md。
          # 发布产物(release.yml)本就在 windows-latest 构建成功,编译面有保证。
          - os: windows
            runner: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Linux:Tauri 编译期依赖(wry / tao 走 glib + webkit2gtk)。
      # 包名与 .github/workflows/release.yml、tauri.conf.json deb.depends 对齐。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libpipewire-0.3-dev \
            libasound2-dev \
            libgbm-dev \
            libdrm-dev \
            libegl-dev \
            libwayland-dev

      # 警告拒绝策略在成员 crate 清单的 [lints] 表中声明(见根 Cargo.toml 注释):
      # 只对本仓库自有 crate deny,reflect-agent/ submodule 的上游警告不阻塞本仓库。
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  test:
    name: rust test (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libpipewire-0.3-dev \
            libasound2-dev \
            libgbm-dev \
            libdrm-dev \
            libegl-dev \
            libwayland-dev

      - name: cargo test
        run: cargo test --workspace --all-targets
