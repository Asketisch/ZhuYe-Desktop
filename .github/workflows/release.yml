# 烛夜 ZhuYe 跨平台发布构建器。
#
# 仅由 `git push --tags v*` 触发。在三个操作系统上并行构建原生安装包，
# 上传产物到 workflow run，并（若 tag 形如发布版本）附加到 GitHub Release。
#
# 本地一次性构建不需要它 —— 请改用 `bash scripts/build.sh`。
# 本 workflow 有意对分支推送保持禁用：日常工作不会触发它。

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:    # 从 Actions 页签手动触发
    inputs:
      visual_update:
        description: '重生成视觉基线(runner 渲染),上传 visual-baselines artifact 供人工审查入库'
        type: boolean
        default: false

permissions:
  contents: write       # softprops/action-gh-release 上传资产所需

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 发布门禁:在**构建之前**把全部功能面审一遍。
  #
  # 三层(静态审查 / 前端行为 / 真后端能力覆盖)全绿才允许出包;出包之后
  # 还有一层产物审查(见 build job 里的 "Audit release artifact")。
  # 详见 tests/README.md 与 tests/COVERAGE.md。
  # ─────────────────────────────────────────────────────────────────────
  gate:
    name: release gate (static + frontend + backend + e2e)
    # 固定 24.04,不用 ubuntu-latest:后者 2026-10 起迁到 Ubuntu 26,
    # `webkit2gtk-driver`(L5 真窗口冒烟的 WebKitWebDriver)在 26 里已无
    # 安装候选,apt 步骤直接退出 100。发布门禁要的是可复现的已知环境。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24:与 ci.yml / package.json `engines.node` 对齐(jsdom 30 →
      # undici 8 要求 Node ≥ 22.19)。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Linux:Tauri 编译期依赖(能力覆盖层要编译整个 src-tauri)。
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libpipewire-0.3-dev \
            libasound2-dev \
            libgbm-dev \
            libdrm-dev \
            libegl-dev \
            libwayland-dev \
            webkit2gtk-driver \
            xvfb

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # L5 视觉回归用 playwright-core(免浏览器 postinstall),浏览器二进制
      # 要显式装;必须走仓库内 playwright-core —— 浏览器 revision 与驱动
      # 版本绑定,`pnpm dlx playwright` 会装到不匹配的 revision。
      # --with-deps:apt 补 chromium 运行库(nss 等)。
      - name: Install Playwright chromium
        run: pnpm exec playwright-core install --with-deps chromium

      # L5 真窗口冒烟要 tauri-driver(Linux 直连 webkit2gtk)。
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # 门禁入口:退出码 0 = 允许发布。E2E_REQUIRED=1:L5 依赖已装齐,
      # 视觉回归 + 真窗口冒烟必须真跑,缺失依赖判失败(不允许静默跳过)。
      # VISUAL_UPDATE=1(经 workflow_dispatch 的 visual_update 输入)时
      # 视觉层改为重生成全部基线 —— 基线由 runner 渲染产生,跨平台
      # 字节级一致才有意义(dev 机的字体栅化与 runner 不同)。
      - name: Run release gate
        env:
          E2E_REQUIRED: '1'
          VISUAL_UPDATE: ${{ inputs.visual_update && '1' || '0' }}
        run: bash tests/run_all.sh static frontend backend e2e

      # 发布审查报告:门禁**失败时最需要看它** —— 所以 always() 上传,
      # 失败也能拿到逐用例明细。include-hidden-files 必须显式开:
      # .test-results 是点开头的隐藏目录,upload-artifact v4.4 起默认
      # 排除隐藏文件/目录(路径写全也没用),不开启则永远 warn + 空产物。
      - name: Upload release review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-review
          path: |
            .test-results/release-review.md
            .test-results/*.log
            .test-results/e2e-window.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      # visual_update dispatch:重生成后的基线上传为 artifact,由维护者
      # 人工审查(像素级过一遍)后替换仓库内 tests/visual/__baselines__/。
      # always():窗口冒烟失败不该吞掉已经重生成好的基线。
      - name: Upload regenerated visual baselines
        if: always() && inputs.visual_update
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/__baselines__/
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # 覆盖三个操作系统的 matrix job。每个 entry 产出自己目标的原生安装包。
  # macOS x86_64 在 arm64 runner 上交叉编译 —— macos-13 / macos-14 runner
  # 均已被 GitHub 淘汰（macos-14 于 2026-11-02 完全退役），固定 macos-15
  # 而不用 macos-latest:后者会漂到 macos-26,包内 SDK/工具链版本随之漂移。
  # 对 Apple 平台 arm64→x86_64 是受支持的目标交叉(cc 无需外部工具链)。
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.os }} / ${{ matrix.bundles }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-arm64
            runner: macos-15
            bundles: app,dmg
            target: ''
          - os: macos-x86_64
            runner: macos-15
            bundles: app,dmg
            target: x86_64-apple-darwin
          - os: linux
            # 24.04 而非 22.04:xcap 0.9 在 Linux 硬依赖 pipewire 0.10,
            # libspa 0.10 的绑定要 SPA 0.3.65+ 的 API(spa_meta_first /
            # spa_meta_region_is_valid / spa_video_info_raw.flags)。
            # 22.04 只有 pipewire 0.3.48,头文件编不过;24.04 是 1.0.5。
            # glibc 2.39 也仍是当前主流桌面发行版基线。
            runner: ubuntu-24.04
            bundles: deb,appimage
            target: ''
          - os: windows
            runner: windows-latest
            bundles: msi
            target: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 必须递归拉 submodule —— 核心 crate(reflect-protocol / reflect-core
          # 等)全在 zhuye-agent/ 里,缺了就编不过。
          submodules: recursive

      - name: Install Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Linux：Tauri 运行时依赖（webkit2gtk-4.1、appindicator、librsvg）+
      # **链接期**开发库(pipewire/alsa/gbm/drm/egl/wayland —— xcap 截屏链经
      # libspa-sys 要 pkg-config 找到 libpipewire-0.3,缺了 release 构建直接
      # panic;与 ci.yml 的 clippy/test 同一批)。deb.depends 是运行时口径,
      # 别拿它当构建期清单用。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libpipewire-0.3-dev \
            libasound2-dev \
            libgbm-dev \
            libdrm-dev \
            libegl-dev \
            libwayland-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build native bundles
        # --no-frontend：pnpm tauri build 的 beforeBuildCommand 已运行
        # `pnpm build`；在 CI runner 上跑两次是浪费。
        # --target：macOS x86_64 在 arm64 runner 上交叉编译，其余为空（宿主目标）。
        run: >-
          bash scripts/build.sh --bundles=${{ matrix.bundles }} --no-frontend
          ${{ matrix.target != '' && format('--target={0}', matrix.target) || '' }}
        # Windows runner 在 GHA 中默认没有 bash，但 windows-latest
        # 预装了 Git Bash，是带 `bash` 前缀的 `run:` 步骤的默认 shell。

      # 产物审查:审**刚打出来的**这个包 —— .app 结构 / Info.plist 键与
      # 版本 / 前端资源已嵌入 / 无开发残留 / 签名。审的是"真要发出去的
      # 那个文件",不是源码。
      - name: Audit release artifact
        shell: bash
        env:
          ARTIFACT_REQUIRED: '1'
          # --target 交叉编译时 Tauri 输出在 target/<triple>/release/bundle;
          # tests/lib.sh 的 DIST_DIR 默认只认宿主路径 target/release/bundle,
          # 不传的话 macos-x86_64 会以「发布产物存在 FAIL」误判。
          # 审查脚本先 `cd "$ROOT"`,相对路径即可;宿主目标留空走默认值。
          DIST_DIR: ${{ matrix.target != '' && format('target/{0}/release/bundle', matrix.target) || '' }}
        run: bash tests/run_all.sh artifact

      - name: Locate artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # 将 Tauri 产出的所有安装包文件收集到扁平暂存目录。
          # 宿主目标在 target/release/bundle;--target 交叉编译在
          # target/<triple>/release/bundle。只把**存在**的根交给 find:
          # find 对缺失路径会以非零码退出,set -e 下整步失败 —— 宿主构建没有
          # 后者,交叉构建没有前者,两种布局都会踩。
          roots=()
          for d in target/release/bundle target/*/release/bundle; do
            [ -d "$d" ] && roots+=("$d")
          done
          if [ "${#roots[@]}" -eq 0 ]; then
            echo "::error::未找到任何 bundle 目录(target/release/bundle 或 target/*/release/bundle)"
            exit 1
          fi
          # .app 是目录不是文件,-type f 永远匹配不到;macOS 的交付物是 .dmg。
          find "${roots[@]}" -type f \( \
            -name '*.dmg' -o \
            -name '*.deb' -o \
            -name '*.AppImage' -o \
            -name '*.msi' -o \
            -name '*.exe' \) -print -exec cp {} artifacts/ \;
          echo "暂存产物列表："
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhuye-desktop-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # 发布上传：仅在所有 matrix job 成功后运行，且仅在
  # 由 tag 推送触发时。手动 dispatch 只暂存产物。
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: attach to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # 只取**安装包** artifact(pattern 限定),不 dump 全部:不加 pattern
      # 时 merge-multiple 会把 release-review(.test-results 下的审查日志)
      # 一起拉进来,最终把 .log 当作发布附件挂到 Release 上。
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: zhuye-desktop-*
          path: release-assets
          merge-multiple: true

      # 发布审查报告单独取(不混进安装包目录)—— 审查结论要跟二进制
      # 一起挂在 Release 上,评审者一眼能看到「这批包审过没有、审了什么」。
      - name: Download release review report
        uses: actions/download-artifact@v4
        with:
          name: release-review
          path: release-review

      - name: List downloaded
        run: ls -la release-assets/ release-review/ 2>/dev/null || true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            release-review/release-review.md
          generate_release_notes: true
          fail_on_unmatched_files: true
