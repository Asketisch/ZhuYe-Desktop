[workspace]
resolver = "2"
members = [
    "app-core",
    "src-tauri",
]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Asketisch/ReflectDesktop"
homepage = "https://github.com/Asketisch/ReflectDesktop"
authors = ["Reflect Agent Contributors"]

# ── 成员 crate 统一 lint 策略 ──────────────────────────────────────
# 通过清单级 [lints](而非 CI 的 RUSTFLAGS=-D warnings)拒绝警告:
# 清单级 deny 只作用于本仓库自有 crate。zhuye-agent/ submodule 以
# path 依赖参与编译,cargo 视其为"本地包",全局 -D warnings 会连带
# 拒绝上游警告并阻塞 CI;上游代码的警告应由 ZhuYe 仓库修复。
#
# ⚠️ 与 [workspace.dependencies] 同一机制:submodule crate 的
# `[lints] workspace = true` 也解析到**本仓库根** —— 下面的 allow
# 清单必须与 zhuye-agent/Cargo.toml 的 [workspace.lints.clippy] 中
# 的 M1 宽松清单保持镜像(上游代码按这份 allow 修,桌面少镜像一条
# 就会在上游存量代码上误报)。上游收紧/放宽时随 submodule 升级同步。
# 上游的性能 deny 纪律(redundant_clone / needless_collect /
# map_unwrap_or,pedantic/nursery 组)是上游内部自查口径,桌面**不
# 继承** —— 避免上游每次收紧都迫使桌面清理存量;上游 crate 在桌面
# 构建下顶多告警(不 deny),其自身 CI 会把关。
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
# 基线:默认 lint 全拒(显式化 CI 的 -D warnings 语义)。
all = "deny"
# M1 宽松清单(上游原 16 个 lib.rs 顶部逐字复制的 11 条 allow,集中于
# 其 workspace;此处镜像)。priority 必须高于 all,否则会被 all=deny 压掉。
derivable_impls    = { level = "allow", priority = 10 }
needless_lifetimes = { level = "allow", priority = 10 }
collapsible_if     = { level = "allow", priority = 10 }
io_other_error     = { level = "allow", priority = 10 }
collapsible_match  = { level = "allow", priority = 10 }
needless_borrow    = { level = "allow", priority = 10 }
redundant_closure  = { level = "allow", priority = 10 }
or_fun_call        = { level = "allow", priority = 10 }
option_if_let_else = { level = "allow", priority = 10 }
nonminimal_bool    = { level = "allow", priority = 10 }
manual_div_ceil    = { level = "allow", priority = 10 }

# ── 核心依赖:从 zhuye-agent submodule 通过 path 引用 ──
# 注:Cargo 不支持嵌套 workspace,这里只用 path 依赖,不把核心 crate 列入 members。
# 核心 crate 仍属于 zhuye-agent 自己的 workspace,通过 path 被本仓库消费。
# workspace.dependencies 必须**完整声明**核心 crate 用 `workspace = true` 继承的全部项
# (含内部 reflect-* 与外部 crate),否则跨 workspace 解析会失败。
[workspace.dependencies]
# protocol 层
reflect-protocol = { package = "zhuye-protocol", path = "zhuye-agent/crates/protocol/zhuye-protocol" }

# abilities 层
reflect-llm        = { package = "zhuye-llm", path = "zhuye-agent/crates/abilities/zhuye-llm" }
reflect-tools      = { package = "zhuye-tools", path = "zhuye-agent/crates/abilities/zhuye-tools" }
reflect-bm25       = { package = "zhuye-bm25", path = "zhuye-agent/crates/abilities/zhuye-bm25" }
reflect-hooks      = { package = "zhuye-hooks", path = "zhuye-agent/crates/abilities/zhuye-hooks" }
reflect-skills     = { package = "zhuye-skills", path = "zhuye-agent/crates/abilities/zhuye-skills" }
reflect-memory     = { package = "zhuye-memory", path = "zhuye-agent/crates/abilities/zhuye-memory" }
reflect-agent-def  = { package = "zhuye-agent-def", path = "zhuye-agent/crates/abilities/zhuye-agent-def" }
reflect-prompt     = { package = "zhuye-prompt", path = "zhuye-agent/crates/abilities/zhuye-prompt" }
reflect-compact    = { package = "zhuye-compact", path = "zhuye-agent/crates/abilities/zhuye-compact" }
reflect-recovery   = { package = "zhuye-recovery", path = "zhuye-agent/crates/abilities/zhuye-recovery" }
reflect-notes      = { package = "zhuye-notes", path = "zhuye-agent/crates/abilities/zhuye-notes" }
reflect-sanitize   = { package = "zhuye-sanitize", path = "zhuye-agent/crates/abilities/zhuye-sanitize" }
reflect-kms        = { package = "zhuye-kms", path = "zhuye-agent/crates/abilities/zhuye-kms" }

# resources 层
reflect-config      = { package = "zhuye-config", path = "zhuye-agent/crates/resources/zhuye-config" }
reflect-permissions = { package = "zhuye-permissions", path = "zhuye-agent/crates/resources/zhuye-permissions" }
reflect-plugin      = { package = "zhuye-plugin", path = "zhuye-agent/crates/resources/zhuye-plugin" }
reflect-rollout     = { package = "zhuye-rollout", path = "zhuye-agent/crates/resources/zhuye-rollout" }
reflect-telemetry   = { package = "zhuye-telemetry", path = "zhuye-agent/crates/resources/zhuye-telemetry" }
reflect-sandbox     = { package = "zhuye-sandbox", path = "zhuye-agent/crates/resources/zhuye-sandbox" }
reflect-ast         = { package = "zhuye-ast", path = "zhuye-agent/crates/resources/zhuye-ast" }
reflect-fs          = { package = "zhuye-fs", path = "zhuye-agent/crates/resources/zhuye-fs" }
reflect-git         = { package = "zhuye-git", path = "zhuye-agent/crates/resources/zhuye-git" }

# orchestration 层
reflect-subagent    = { package = "zhuye-subagent", path = "zhuye-agent/crates/orchestration/zhuye-subagent" }
reflect-discussion  = { package = "zhuye-discussion", path = "zhuye-agent/crates/orchestration/zhuye-discussion" }
reflect-task        = { package = "zhuye-task", path = "zhuye-agent/crates/orchestration/zhuye-task" }
reflect-pipeline    = { package = "zhuye-pipeline", path = "zhuye-agent/crates/orchestration/zhuye-pipeline" }
reflect-goal        = { package = "zhuye-goal", path = "zhuye-agent/crates/orchestration/zhuye-goal" }

# integrations 层
reflect-mcp         = { package = "zhuye-mcp", path = "zhuye-agent/crates/integrations/zhuye-mcp" }
reflect-lsp         = { package = "zhuye-lsp", path = "zhuye-agent/crates/integrations/zhuye-lsp" }
reflect-integration = { package = "zhuye-integration", path = "zhuye-agent/crates/integrations/zhuye-integration" }
reflect-stream      = { package = "zhuye-stream", path = "zhuye-agent/crates/integrations/zhuye-stream" }
reflect-import      = { package = "zhuye-import", path = "zhuye-agent/crates/integrations/zhuye-import" }
reflect-computer-use = { package = "zhuye-computer-use", path = "zhuye-agent/crates/integrations/zhuye-computer-use" }
reflect-shell       = { package = "zhuye-shell", path = "zhuye-agent/crates/integrations/zhuye-shell" }
