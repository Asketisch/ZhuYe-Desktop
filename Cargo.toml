zhuye-exec = { path = "zhuye-agent/crates/runtime/zhuye-exec" }
zhuye-cli  = { path = "zhuye-agent/crates/runtime/zhuye-cli" }
zhuye-py   = { path = "zhuye-agent/crates/runtime/zhuye-py" }
zhuye = { path = "zhuye-agent/crates/runtime/zhuye" }

# Desktop 自有共享层(UI 无关应用层,Tauri 与未来其它 runtime 复用)
reflect-app-core    = { path = "app-core" }

# ── 通用外部依赖(需与核心 workspace 对齐版本,核心 crate 的 workspace=true 会解析到这里)──
tokio              = { version = "1", features = ["full"] }
tokio-util         = "0.7"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
serde_yaml         = "0.9"
toml               = "0.8"
async-trait        = "0.1"
anyhow             = "1"
dirs               = "5"
thiserror          = "1"
clap               = { version = "4", features = ["derive"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures            = "0.3"
uuid               = { version = "1", features = ["v4", "v7", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
parking_lot        = "0.12"
schemars           = "0.8"
once_cell          = "1"
wiremock           = "0.6"
insta              = { version = "1", features = ["yaml"] }
# v1.x(上游 0.1.11):property-based 测试 —— 纯函数不变式用随机输入
# 探索,补手写用例盲区(桌面侧已在 src-tauri dev-dependencies 使用)。
proptest           = "1"

# Tauri 2 stack (used only by src-tauri)
tauri              = { version = "2", features = [] }
tauri-build        = { version = "2", features = [] }

# LLM/Tools(核心 crate 依赖,需在此声明供 workspace=true 解析)
reqwest            = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"] }
tiktoken-rs        = "0.12"
# pyo3 ≥ 0.27 才正式支持 Python 3.14 final;0.30 进一步支持 3.15,与核心 workspace 对齐。
pyo3               = "0.30"
walkdir            = "2"
ignore             = "0.4"
similar            = "2"
regex              = "1"
globset            = "0.4"
url               = "2"
image              = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
xcap               = "0.9"
enigo              = "0.6"
eventsource-stream = "0.2"
rankfns            = "0.1"
htmd               = "0.5"
minijinja          = "2"
sled               = "0.34"
# 会话导入(zhuye-import):ZCode 历史存于 SQLite;bundled 自带 C 源,免系统依赖。
rusqlite           = { version = "0.41", features = ["bundled"] }
# zhuye-secrets:HKDF-SHA256 每条目派生(per-entry salt),getrandom 由 aes-gcm
# 默认 feature 提供(Nonce/Key 生成用 OsRng)。
sha2               = "0.10"
aes-gcm            = "0.10"
hkdf               = "0.12"
# v1.x WASM 插件宿主(zhuye-wasm,组件模型):features 裁剪只留运行时 +
# 组件模型 + Cranelift 编译器 + async(epoch 中断计时),控制二进制体积。
# 版本锁定 30:与 guest 侧 wit-bindgen 0.40(产 wasi 0.2.3 组件)同代 ——
# 宿主与社区组件的 wasi 小版本必须一致。
wasmtime           = { version = "=36.0.20", default-features = false, features = [
    "async", "cranelift", "component-model", "runtime",
] }
wasmtime-wasi      = { version = "=36.0.20", default-features = false }
filetime           = "0.2"
pollster           = "0.4"
lsp-types          = { version = "=0.97", default-features = false }
rmcp               = { version = "=3.10.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
opentelemetry         = "0.27"
opentelemetry_sdk     = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp    = { version = "0.27", features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
incremental = true

[profile.test]
debug = 1
codegen-units = 256
