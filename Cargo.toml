[workspace]
resolver = "2"
members = [
    "app-core",
    "src-tauri",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Asketisch/ReflectDesktop"
homepage = "https://github.com/Asketisch/ReflectDesktop"
authors = ["Reflect Agent Contributors"]

# ── 成员 crate 统一 lint 策略 ──────────────────────────────────────
# 通过清单级 [lints](而非 CI 的 RUSTFLAGS=-D warnings)拒绝警告:
# 清单级 deny 只作用于本仓库自有 crate。reflect-agent/ submodule 以
# path 依赖参与编译,cargo 视其为"本地包",全局 -D warnings 会连带
# 拒绝上游警告并阻塞 CI;上游代码的警告应由 Reflect-Agent 仓库修复。
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

# ── 核心依赖:从 reflect-agent submodule 通过 path 引用 ──
# 注:Cargo 不支持嵌套 workspace,这里只用 path 依赖,不把核心 crate 列入 members。
# 核心 crate 仍属于 reflect-agent 自己的 workspace,通过 path 被本仓库消费。
# workspace.dependencies 必须**完整声明**核心 crate 用 `workspace = true` 继承的全部项
# (含内部 reflect-* 与外部 crate),否则跨 workspace 解析会失败。
[workspace.dependencies]
# protocol 层
reflect-protocol = { package = "zhuye-protocol", path = "reflect-agent/crates/protocol/zhuye-protocol" }

# abilities 层
reflect-llm        = { package = "zhuye-llm", path = "reflect-agent/crates/abilities/zhuye-llm" }
reflect-tools      = { package = "zhuye-tools", path = "reflect-agent/crates/abilities/zhuye-tools" }
reflect-bm25       = { package = "zhuye-bm25", path = "reflect-agent/crates/abilities/zhuye-bm25" }
reflect-hooks      = { package = "zhuye-hooks", path = "reflect-agent/crates/abilities/zhuye-hooks" }
reflect-skills     = { package = "zhuye-skills", path = "reflect-agent/crates/abilities/zhuye-skills" }
reflect-memory     = { package = "zhuye-memory", path = "reflect-agent/crates/abilities/zhuye-memory" }
reflect-agent-def  = { package = "zhuye-agent-def", path = "reflect-agent/crates/abilities/zhuye-agent-def" }
reflect-prompt     = { package = "zhuye-prompt", path = "reflect-agent/crates/abilities/zhuye-prompt" }
reflect-compact    = { package = "zhuye-compact", path = "reflect-agent/crates/abilities/zhuye-compact" }
reflect-recovery   = { package = "zhuye-recovery", path = "reflect-agent/crates/abilities/zhuye-recovery" }
reflect-notes      = { package = "zhuye-notes", path = "reflect-agent/crates/abilities/zhuye-notes" }
reflect-sanitize   = { package = "zhuye-sanitize", path = "reflect-agent/crates/abilities/zhuye-sanitize" }

# resources 层
reflect-config      = { package = "zhuye-config", path = "reflect-agent/crates/resources/zhuye-config" }
reflect-permissions = { package = "zhuye-permissions", path = "reflect-agent/crates/resources/zhuye-permissions" }
reflect-plugin      = { package = "zhuye-plugin", path = "reflect-agent/crates/resources/zhuye-plugin" }
reflect-rollout     = { package = "zhuye-rollout", path = "reflect-agent/crates/resources/zhuye-rollout" }
reflect-telemetry   = { package = "zhuye-telemetry", path = "reflect-agent/crates/resources/zhuye-telemetry" }
reflect-sandbox     = { package = "zhuye-sandbox", path = "reflect-agent/crates/resources/zhuye-sandbox" }
reflect-ast         = { package = "zhuye-ast", path = "reflect-agent/crates/resources/zhuye-ast" }

# orchestration 层
reflect-subagent    = { package = "zhuye-subagent", path = "reflect-agent/crates/orchestration/zhuye-subagent" }
reflect-discussion  = { package = "zhuye-discussion", path = "reflect-agent/crates/orchestration/zhuye-discussion" }
reflect-task        = { package = "zhuye-task", path = "reflect-agent/crates/orchestration/zhuye-task" }
reflect-pipeline    = { package = "zhuye-pipeline", path = "reflect-agent/crates/orchestration/zhuye-pipeline" }
reflect-goal        = { package = "zhuye-goal", path = "reflect-agent/crates/orchestration/zhuye-goal" }

# integrations 层
reflect-mcp         = { package = "zhuye-mcp", path = "reflect-agent/crates/integrations/zhuye-mcp" }
reflect-lsp         = { package = "zhuye-lsp", path = "reflect-agent/crates/integrations/zhuye-lsp" }
reflect-integration = { package = "zhuye-integration", path = "reflect-agent/crates/integrations/zhuye-integration" }
reflect-stream      = { package = "zhuye-stream", path = "reflect-agent/crates/integrations/zhuye-stream" }

# runtime 层
reflect-core = { package = "zhuye-core", path = "reflect-agent/crates/runtime/zhuye-core" }
reflect      = { package = "zhuye", path = "reflect-agent/crates/runtime/zhuye" }

zhuye-protocol = { path = "reflect-agent/crates/protocol/zhuye-protocol" }
zhuye-llm = { path = "reflect-agent/crates/abilities/zhuye-llm" }
zhuye-tools = { path = "reflect-agent/crates/abilities/zhuye-tools" }
zhuye-bm25 = { path = "reflect-agent/crates/abilities/zhuye-bm25" }
zhuye-hooks = { path = "reflect-agent/crates/abilities/zhuye-hooks" }
zhuye-skills = { path = "reflect-agent/crates/abilities/zhuye-skills" }
zhuye-memory = { path = "reflect-agent/crates/abilities/zhuye-memory" }
zhuye-agent-def = { path = "reflect-agent/crates/abilities/zhuye-agent-def" }
zhuye-prompt = { path = "reflect-agent/crates/abilities/zhuye-prompt" }
zhuye-compact = { path = "reflect-agent/crates/abilities/zhuye-compact" }
zhuye-recovery = { path = "reflect-agent/crates/abilities/zhuye-recovery" }
zhuye-notes = { path = "reflect-agent/crates/abilities/zhuye-notes" }
zhuye-sanitize = { path = "reflect-agent/crates/abilities/zhuye-sanitize" }
zhuye-config = { path = "reflect-agent/crates/resources/zhuye-config" }
zhuye-permissions = { path = "reflect-agent/crates/resources/zhuye-permissions" }
zhuye-plugin = { path = "reflect-agent/crates/resources/zhuye-plugin" }
zhuye-rollout = { path = "reflect-agent/crates/resources/zhuye-rollout" }
zhuye-telemetry = { path = "reflect-agent/crates/resources/zhuye-telemetry" }
zhuye-sandbox = { path = "reflect-agent/crates/resources/zhuye-sandbox" }
zhuye-ast = { path = "reflect-agent/crates/resources/zhuye-ast" }
zhuye-subagent = { path = "reflect-agent/crates/orchestration/zhuye-subagent" }
zhuye-discussion = { path = "reflect-agent/crates/orchestration/zhuye-discussion" }
zhuye-task = { path = "reflect-agent/crates/orchestration/zhuye-task" }
zhuye-pipeline = { path = "reflect-agent/crates/orchestration/zhuye-pipeline" }
zhuye-goal = { path = "reflect-agent/crates/orchestration/zhuye-goal" }
zhuye-mcp = { path = "reflect-agent/crates/integrations/zhuye-mcp" }
zhuye-lsp = { path = "reflect-agent/crates/integrations/zhuye-lsp" }
zhuye-integration = { path = "reflect-agent/crates/integrations/zhuye-integration" }
zhuye-stream = { path = "reflect-agent/crates/integrations/zhuye-stream" }
zhuye-core = { path = "reflect-agent/crates/runtime/zhuye-core" }
zhuye = { path = "reflect-agent/crates/runtime/zhuye" }

# Desktop 自有共享层(UI 无关应用层,Tauri 与未来其它 runtime 复用)
reflect-app-core    = { path = "app-core" }

# ── 通用外部依赖(需与核心 workspace 对齐版本,核心 crate 的 workspace=true 会解析到这里)──
tokio              = { version = "1", features = ["full"] }
tokio-util         = "0.7"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
serde_yaml         = "0.9"
toml               = "0.8"
async-trait        = "0.1"
anyhow             = "1"
dirs               = "5"
thiserror          = "1"
clap               = { version = "4", features = ["derive"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures            = "0.3"
uuid               = { version = "1", features = ["v4", "v7", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
parking_lot        = "0.12"
schemars           = "0.8"
once_cell          = "1"
wiremock           = "0.6"
insta              = { version = "1", features = ["yaml"] }

# Tauri 2 stack (used only by src-tauri)
tauri              = { version = "2", features = [] }
tauri-build        = { version = "2", features = [] }

# LLM/Tools(核心 crate 依赖,需在此声明供 workspace=true 解析)
reqwest            = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"] }
tiktoken-rs        = "0.12"
pyo3               = "0.23"
walkdir            = "2"
ignore             = "0.4"
similar            = "2"
regex              = "1"
globset            = "0.4"
url               = "2"
image              = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
xcap               = "0.9"
enigo              = "0.6"
eventsource-stream = "0.2"
rankfns            = "0.1"
htmd               = "0.5"
minijinja          = "2"
sled               = "0.34"
filetime           = "0.2"
pollster           = "0.4"
lsp-types          = { version = "=0.97", default-features = false }
rmcp               = { version = "=1.7.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
opentelemetry         = "0.27"
opentelemetry_sdk     = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp    = { version = "0.27", features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
incremental = true

[profile.test]
debug = 1
codegen-units = 256
